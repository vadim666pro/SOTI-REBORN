        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletCSShotgunSpread
  - type: SpentAmmoVisuals
    state: "shell"

# Magazine definitions for CS weapons

# Pistol magazine (USP, Glock, Beretta)
- type: entity
  parent: BaseMagazinePistol
  id: MagazineCSPistol
  name: magazine (cs pistol)
  components:
  - type: Tag
    tags:
      - MagazinePistol
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgePistol
    capacity: 12
    proto: CartridgeCSSPistol
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg

# High capacity pistol magazine (Tec-9, FiveSeven)
- type: entity
