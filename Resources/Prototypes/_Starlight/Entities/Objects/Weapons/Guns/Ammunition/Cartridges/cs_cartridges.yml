# CS Hitscan Cartridges

# Pistol cartridges (USP, Glock, Tec-9, FiveSeven, Beretta)
- type: entity
  parent: [BaseCartridge, BaseSecurityContraband]
  id: CartridgeCSSPistol
  name: cartridge (cs pistol)
  components:
  - type: Tag
    tags:
      - CartridgePistol
  - type: CartridgeAmmo
    proto: BulletCSSPistol
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

# High capacity pistol cartridge (Tec-9, FiveSeven)
- type: entity
  parent: CartridgeCSSPistol
  id: CartridgeCSSPistolHighCapacity
  name: cartridge (cs pistol high capacity)
  components:
  - type: CartridgeAmmo
    proto: BulletCSSPistol

