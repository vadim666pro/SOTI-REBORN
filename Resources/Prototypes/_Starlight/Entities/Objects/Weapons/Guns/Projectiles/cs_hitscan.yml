# CS Hitscan Projectiles - Base entities

- type: entity
  id: BasicCSHitscanNoBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
  - type: HitscanReflect
  - type: HitscanBasicEffects

- type: entity
  id: BasicCSHitscan
  parent: BasicCSHitscanNoBeam
  name: basic cs laser ray
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle
    travelFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: trace
    impactFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact

# Pistol hitscan projectiles

- type: entity
  id: BulletCSSPistol
  parent: BasicCSHitscan
  name: cs pistol bullet
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Piercing: 20
  - type: HitscanBasicVisuals
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: bullet

- type: entity
  id: BulletCSSPistolHighDamage
  parent: BasicCSHitscan
  name: cs pistol bullet (high damage)
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Piercing: 35
  - type: HitscanBasicVisuals
    bullet:
