- type: entity
  id: WeaponCaseBase
  parent: BaseStorageItem
  name: Weapon Case
  description: Now you will never take wrong magazines for your guns
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Other/WeaponCase.rsi
    state: icon
  - type: Item
    sprite: Objects/counterstrike/Other/WeaponCase.rsi
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,8,4

# оружие для кт
- type: entity
  id: WeaponCaseUSP
  parent: WeaponCaseBase
  name: Case with USP-S
  description: there is gun 
