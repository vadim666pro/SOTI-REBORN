- type: entity
  id: CollisionFloorTeleporterBase
  abstract: true
  parent: MarkerBase
  name: Floor Teleporter Base
  description: "Invisible teleporter base. Step on it to teleport to linked destination."
  components:
  - type: CollisionFloorTeleporter
    cooldownTime: 0.1
    teleportSound: /Audio/Effects/teleport_arrival.ogg
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      teleporterFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        isTrigger: true
        layer:
          - SlipLayer
        mask:
          - MobMask

- type: entity
  id: FloorTeleporterA
  parent: CollisionFloorTeleporterBase
  name: Floor Teleporter A
  description: "Teleports to linked entity. Blue marker."
  suffix: A
  components:
  - type: Sprite
    state: blue

- type: entity
  id: FloorTeleporterB
  parent: CollisionFloorTeleporterBase
  name: Floor Teleporter B
  description: "Teleports to linked entity. Red marker."
  suffix: B
  components:
  - type: Sprite
    state: red
