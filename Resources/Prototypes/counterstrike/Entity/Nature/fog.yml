# Dust particle with Particle component
- type: entity
  id: SimpleDust
  name: dust
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Nature/Fog/dust.rsi
    drawdepth: Overdoors
    layers:
    - map: ["base"]
      state: dust1
  - type: RandomSprite
    available:
    - base:
        dust1: ""
        dust2: ""
        dust3: ""
  - type: Particle
    fadeInFraction: 0.3
    fadeOutFraction: 0.3
    airResistance: 0.0
  - type: Physics
    bodyType: Dynamic
    bodyStatus: InAir
    linearDamping: 0
  - type: Fixtures
    fixtures:
      cloud:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 0.1
        hard: false
  - type: TimedDespawn
    lifetime: 40

# Simple emitter
- type: entity
  id: SimpleDustEmitter
  name: dust emitter
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
  - type: ParticleSpawner
    particle: SimpleDust
    maxParticles: 3
    intervalMax: 15
    intervalMin: 5
    lifetimeMin: 40
    lifetimeMax: 40
    speedMin: 0.2
    speedMax: 0.3
    spread: 360

# Directional emitter
- type: entity
  id: SimpleDustEmitterSouth
  name: dust emitter (south)
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
  - type: ParticleSpawner
    maxParticles: 3
    particle: SimpleDust
    intervalMax: 15
    intervalMin: 5
    lifetimeMin: 40
    lifetimeMax: 40
    speedMin: 0.2
    speedMax: 0.3
    spread: 90
    direction: 0
