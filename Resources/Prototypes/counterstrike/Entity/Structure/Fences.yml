- type: entity
  id: CSOfficePartition
  name: office partition
  description: A glass office partition. You can see and shoot through it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: WallTops
    sprite: Objects/counterstrike/Structures/Obstructions/OfficeFence.rsi
    state: full
  - type: Icon
    sprite: Objects/counterstrike/Structures/Obstructions/OfficeFence.rsi
    state: icon
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: HitscanPassthrough
  - type: Occluder
    enabled: false
