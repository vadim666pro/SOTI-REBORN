- type: entity
  id: ObstructionBase
  parent: BaseStructureDynamic
  name: base Obstruction
  description: Obstruction
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: Physics
    mass: 100
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
# это родитель для всех добавленных препятствий на соти
- type: entity
  id: ObstructionWoodenCrate
  parent: ObstructionBase
  name: Big wooden crate
  description: this crate is quite big
  components:
