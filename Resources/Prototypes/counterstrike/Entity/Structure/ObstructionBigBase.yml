- type: entity
  id: ObstructionBigBase
  parent: BaseStructureDynamic
  name: base big Obstruction
  description: Big obstruction
  abstract: false
  placement:
    mode: PlaceFree  
  components:
  - type: Sprite
    noRot: false
  - type: Physics
    mass: 3000
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-1.0,0.5,1.0"
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Anchorable
# это родитель для больших препятствий



