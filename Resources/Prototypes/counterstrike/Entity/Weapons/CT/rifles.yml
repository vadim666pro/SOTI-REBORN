# CT Rifles

- type: entity
  name: M4A1
  parent: [BaseWeaponRifle, BaseSecurityContraband, BaseRiffleCS]
  id: WeaponRifleM4
  description: M4A1 carbine.
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/PrimaryCT/m4.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 8
    minAngle: 3
    maxAngle: 60
    angleIncrease: 5
    angleDecay: 15
    selectedMode: FullAuto
    availableModes: [ FullAuto ]
    soundGunshot: { path: /Audio/Weapons/counterstrike/guns/m4s.ogg }
  - type: GunWieldBonus
    minAngle: -1
    maxAngle: -1
  - type: Clothing
    sprite: Objects/counterstrike/Weapons/PrimaryCT/m4.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack: { path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCSM4
        insertSound: { path: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg }
        ejectSound: { path: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg }
        priority: 2
        whitelist: { tags: [ MagazineRifle ] }
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCSM4
        priority: 1
        whitelist: { tags: [ CartridgeRifle ] }
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

