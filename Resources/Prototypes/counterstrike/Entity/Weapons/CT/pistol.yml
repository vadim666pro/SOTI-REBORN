# CT Pistols

- type: entity
  name: USP-S
  parent: [BaseWeaponPistol, BaseSecurityContraband, BasePistolCS]
  id: WeaponPistolUSP
  description: CT starting pistol.
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/SecondaryCT/usp.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 5
    soundGunshot: { path: /Audio/Weapons/counterstrike/guns/m4s.ogg }
  - type: Clothing
    sprite: Objects/counterstrike/Weapons/SecondaryCT/usp.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack: { path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCSUSP
        insertSound: { path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg }
        ejectSound: { path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg }
        priority: 2
        whitelist: { tags: [ MagazinePistol ] }
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCSUSP
        priority: 1
        whitelist: { tags: [ CartridgePistol ] }
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

