- type: entity
  parent: [BaseCartridge, BaseSecurityContraband]
  id: CartridgeCSUSP
  name: cartridge (usp)
  components:
  - type: Tag
    tags: [ Cart_USP ]
  - type: CartridgeAmmo
    proto: BulletCSUSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers: [ { state: base, map: ["enum.AmmoVisualLayers.Base"] } ]
