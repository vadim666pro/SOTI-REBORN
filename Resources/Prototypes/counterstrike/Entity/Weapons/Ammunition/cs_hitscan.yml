# CS Hitscan Projectiles - Per-weapon damage

- type: entity
  id: BasicCSHitscanNoBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
  - type: HitscanReflect
  - type: HitscanBasicEffects

- type: entity
  id: BasicCSHitscan
  parent: BasicCSHitscanNoBeam
  name: basic cs laser ray
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle
    travelFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: trace
    impactFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact

