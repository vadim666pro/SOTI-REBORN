# USP magazine
- type: entity
  parent: BaseMagazinePistol
  id: MagazineCSUSP
  name: magazine (usp)
  components:
  - type: Tag
    tags: [ Mag_USP ]
  - type: BallisticAmmoProvider
    whitelist: { tags: [ Cart_USP ] }
    capacity: 12
    proto: CartridgeCSUSP
    soundInsert: { path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg }

