# AMMO BOXES
# ══════════════════════════════════════════════════════════════════════════════

# NOVA box
- type: entity
  id: BoxCSNova
  parent: BaseAmmoProvider
  name: box of shotgun shells for Nova
  description: Contains 6 shotgun shells.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: ShellCSShotgun
    capacity: 16
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/Ammunition/ammobox.rsi
    state: base
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2

# XM1014 box
- type: entity
  id: BoxCSXM1014
  parent: BoxCSNova
  name: box of shotgun shells for XM1014
  description: Contains 6 shotgun shells for XM1014.
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/Ammunition/ammobox.rsi
    state: base
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: ShellCSXM1014
    capacity: 16

