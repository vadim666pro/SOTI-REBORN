# T Pistols

- type: entity
  name: Tec-9
  parent: [BaseWeaponPistol, BaseSecurityContraband, BasePistolCS]
  id: WeaponPistolTec9
  description: T automatic pistol.
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/SecondaryT/tec9.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 8
    selectedMode: FullAuto
    availableModes: [ FullAuto ]
    soundGunshot: { path: /Audio/Weapons/counterstrike/guns/m4s.ogg }
  - type: Clothing
    sprite: Objects/counterstrike/Weapons/SecondaryT/tec9.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack: { path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCSTec9
        insertSound: { path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg }
        ejectSound: { path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg }
        priority: 2
        whitelist: { tags: [ MagazinePistolHighCapacity ] }
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCSTec9
        priority: 1
        whitelist: { tags: [ CartridgePistol ] }
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

- type: entity
  name: Deagle
  parent: [BaseWeaponPistol, BaseSecurityContraband, BasePistolCS]
  id: WeaponPistolDeagle
  description: High damage magnum pistol.
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Weapons/SecondaryT/Deagle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 3
    soundGunshot: { path: /Audio/Weapons/counterstrike/guns/ak.ogg }
  - type: Clothing
    sprite: Objects/counterstrike/Weapons/SecondaryT/Deagle.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack: { path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCSDeagle
        insertSound: { path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg }
        ejectSound: { path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg }
        priority: 2
        whitelist: { tags: [ MagazineMagnum ] }
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCSDeagle
        priority: 1
        whitelist: { tags: [ CartridgeMagnum ] }
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
