- type: entity
  id: CsTrainSpeedingKillZone
  parent: BaseMeteor
  name: Поезд с собачьим жиром
  components:
  - type: Sprite
    sprite: Objects/counterstrike/Structures/Obstructions/Cars/train.rsi
    state: train0
    drawdepth: Doors
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-4,-1.5,4,1.25"
        density: 500
        hard: true
        layer:
        - MidImpassable
        mask:
        - Impassable
  - type: Meteor
    damageTypes:
      types:
        Piercing: 200
  - type: Destructible
    thresholds: []
  - type: Explosive
    maxIntensity: 0
    totalIntensity: 0



- type: entity
  id: CsTrainSpawnerTimer
  name: speeding train spawner
  components:
  - type: Sprite
    sprite: Markers/markers.rsi
    state: spawn
    visible: false
  - type: AutoSpawner
    prototype: TrainBulunskEastbound
    interval: 60
